[package]
name = "skills"
version = "0.1.0-alpha.4"
edition = "2024"
description = "Terminal manager for Agent Skills shared between coding agents: one central directory, per-agent symlinks, metadata in TOML, no database"
license = "MIT"
repository = "https://github.com/yaojie-shen/Skills-Manager-TUI"
keywords = ["agent-skills", "tui", "cli", "symlink", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
flate2 = "1.1.10"
libc = "0.2.189"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.5"
toml_edit = "0.25.13"
tui-markdown = { version = "0.3.9", default-features = false }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"
