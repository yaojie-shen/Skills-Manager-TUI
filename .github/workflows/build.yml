name: Build release archives

# Reusable build shared by the stable release (release.yml) and the rolling
# nightly prerelease (nightly.yml). Caller workflow-level env is not inherited here.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check out and build
        required: true
        type: string
      build_version:
        description: Value for SKILLS_BUILD_VERSION; empty keeps the Cargo version
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.0

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      BUILD_VERSION: ${{ inputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          linker_key=$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${linker_key}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: Check tagged source
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --target "$TARGET" -- -D warnings
          cargo test --locked --all-targets --target "$TARGET"
      - name: Build optimized binary
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: |
          # Stable builds leave SKILLS_BUILD_VERSION unset so they compile exactly as before.
          if [[ -n "$BUILD_VERSION" ]]; then
            export SKILLS_BUILD_VERSION="$BUILD_VERSION"
          fi
          cargo build --locked --release --target "$TARGET"
      - name: Verify binary
        shell: bash
        run: |
          binary="target/$TARGET/release/skills"
          version_output=$("$binary" --version)
          printf '%s\n' "$version_output"
          if [[ -n "$BUILD_VERSION" && "$version_output" != *"$BUILD_VERSION"* ]]; then
            echo "Expected --version to report $BUILD_VERSION" >&2
            exit 1
          fi
          "$binary" --help > /dev/null
          file "$binary"
          if [[ "$TARGET" == *-unknown-linux-musl ]]; then
            if readelf -l "$binary" | grep -q INTERP; then
              echo 'Linux release must be static: found an ELF interpreter' >&2
              exit 1
            fi
            if readelf -d "$binary" | grep -q NEEDED; then
              echo 'Linux release must be static: found a shared library dependency' >&2
              exit 1
            fi
          else
            test "$(lipo -archs "$binary")" = "${{ matrix.arch }}"
          fi
      - name: Package binary and licenses
        shell: bash
        run: |
          package="skills-$TARGET"
          mkdir -p "dist/$package/licenses"
          cp "target/$TARGET/release/skills" "dist/$package/skills"
          cp LICENSE "dist/$package/LICENSE"
          cp data/dict/LICENSE-*.txt data/dict/SOURCES.md "dist/$package/licenses/"
          tar -czf "dist/$package.tar.gz" -C dist "$package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
