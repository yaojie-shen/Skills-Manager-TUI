name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      publish:
        description: Publish the GitHub Release after building
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match tag to Cargo version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match Cargo version v{version}")
          commit = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True
          ).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if head != commit:
              raise SystemExit("Checkout does not match the requested tag")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag={tag}\ncommit={commit}\n")
              f.write(f"prerelease={str('-' in version.split('+', 1)[0]).lower()}\n")
          PY

  build:
    name: Build
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.version.outputs.commit }}

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || inputs.publish
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Create draft, upload, and publish
        shell: bash
        run: |
          # Existing published releases are left intact; retries can finish a draft.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release.json)" != true ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
